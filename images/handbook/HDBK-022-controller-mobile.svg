<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1190" viewBox="0 0 520 1190" role="img" aria-labelledby="title desc"><title id="title">Conversation controller and task authority</title><desc id="desc">Vertical view of the separate media path, controller routing and governed effect owner.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#9db3cb" stroke-width="1.5"/></marker></defs><rect width="520" height="1190" fill="#0a1628"/><text x="24" y="42" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#6dd6dd" font-weight="700">ONE EFFECT OWNER</text><rect x="24" y="70" width="472" height="108" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="44" y="109" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6dd6dd" font-weight="700">User interface</text><text x="44" y="146" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Microphone, speaker, text</text><path d="M260 180 L260 222" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="288" y="211" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9db3cb" font-weight="400">Media</text><rect x="24" y="236" width="472" height="108" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="44" y="275" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6dd6dd" font-weight="700">Speech frontend</text><text x="44" y="312" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Listen, yield, speak</text><path d="M260 346 L260 397" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="288" y="380" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9db3cb" font-weight="400">Events</text><rect x="24" y="414" width="472" height="142" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="44" y="453" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#edbc69" font-weight="700">Controller</text><text x="44" y="490" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Requests, revisions, tickets</text><text x="44" y="522" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Captions and exact approvals</text><path d="M260 558 L260 578" fill="none" stroke="#9db3cb" stroke-width="2.5"/><path d="M260 578 L42 578" fill="none" stroke="#9db3cb" stroke-width="2.5"/><path d="M42 578 L42 975" fill="none" stroke="#9db3cb" stroke-width="2.5"/><path d="M42 656 L68 656" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="74" y="598" width="422" height="115" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="94" y="637" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6dd6dd" font-weight="700">Talk</text><text x="94" y="674" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Greeting; no business effects</text><path d="M42 816 L68 816" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="74" y="758" width="422" height="115" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="94" y="797" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#edbc69" font-weight="700">Fast</text><text x="94" y="834" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Authorized, fresh observations</text><path d="M42 976 L68 976" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="74" y="918" width="422" height="115" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="94" y="957" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#91d5ad" font-weight="700">Consult: governed agent</text><text x="94" y="994" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Owns policy, tasks and effects</text><path d="M260 1035 L260 1075" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="1086" width="472" height="80" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="44" y="1125" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#91d5ad" font-weight="700">Durable records and receipts</text></svg>
