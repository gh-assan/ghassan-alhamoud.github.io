<svg xmlns="http://www.w3.org/2000/svg" width="520" height="765" viewBox="0 0 520 765" role="img" aria-labelledby="title desc"><title id="title">Interruption, correction and reconnect</title><desc id="desc">Vertical view: playback generation, request revision and owner epoch change independently. Effect receipts are not rewritten.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#9db3cb" stroke-width="1.5"/></marker></defs><rect width="520" height="765" fill="#0a1628"/><text x="24" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#6dd6dd" font-weight="700">THREE SEPARATE BOUNDARIES</text><rect x="24" y="76" width="472" height="165" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="44" y="115" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6dd6dd" font-weight="700">Barge-in</text><text x="44" y="152" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Playback: g4 → g5</text><text x="44" y="184" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Clear sound; work may continue</text><rect x="24" y="281" width="472" height="165" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="44" y="320" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#edbc69" font-weight="700">Correction</text><text x="44" y="357" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Request r7: v1 → v2</text><text x="44" y="389" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Old speech drops; govern redirect</text><rect x="24" y="486" width="472" height="165" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="44" y="525" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#91d5ad" font-weight="700">Reconnect</text><text x="44" y="562" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Media owner: o3 → o4</text><text x="44" y="594" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">New briefing; durable work stays</text><text x="24" y="705" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Task truth comes from the executor.</text><text x="24" y="744" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">A cleared player is not cancellation.</text></svg>
