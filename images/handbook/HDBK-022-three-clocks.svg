<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Interruption, correction and reconnect</title><desc id="desc">Interruption changes playback generation. Correction changes one request revision. Reconnect changes media ownership. Effects remain recorded by the task runtime.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#9db3cb" stroke-width="1.5"/></marker></defs><rect width="1100" height="700" fill="#0a1628"/><text x="36" y="48" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#6dd6dd" font-weight="700">THREE EVENTS. THREE DIFFERENT BOUNDARIES.</text><text x="36" y="148" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#6dd6dd" font-weight="700">Barge-in</text><path d="M260 140 L322 140" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="105" width="724" height="125" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="360" y="144" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#6dd6dd" font-weight="700">Playback generation g4 → g5</text><text x="360" y="181" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9db3cb" font-weight="400">Clear sound; work may continue</text><text x="36" y="308" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#edbc69" font-weight="700">Correction</text><path d="M260 300 L322 300" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="265" width="724" height="125" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="360" y="304" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#edbc69" font-weight="700">Request r7: v1 → v2</text><text x="360" y="341" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9db3cb" font-weight="400">Drop old speech; govern the redirect</text><text x="36" y="468" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#91d5ad" font-weight="700">Reconnect</text><path d="M260 460 L322 460" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="425" width="724" height="125" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="360" y="464" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#91d5ad" font-weight="700">Media owner o3 → o4</text><text x="360" y="501" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9db3cb" font-weight="400">Rebuild briefing; keep durable work</text><text x="36" y="642" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#9db3cb" font-weight="400">Only the executor can establish whether an effect completed or was cancelled.</text></svg>
