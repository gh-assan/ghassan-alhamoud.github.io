<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1100" viewBox="0 0 520 1100" role="img" aria-labelledby="title desc"><title id="title">Durable ticket flow</title><desc id="desc">Six steps from accepted request to verified spoken result. Conversation continues while the ticket runs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#9db3cb" stroke-width="1.5"/></marker></defs><rect width="520" height="1100" fill="#0a1628"/><text x="24" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#edbc69" font-weight="700">DURABLE WORK, LIVE TALK</text><rect x="24" y="70" width="472" height="122" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="44" y="109" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6dd6dd" font-weight="700">1  Accept</text><text x="44" y="146" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Resolve target and revision</text><path d="M260 194 L260 230" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="235" width="472" height="122" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="44" y="274" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#91d5ad" font-weight="700">2  Admit</text><text x="44" y="311" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Store request → durable ticket</text><path d="M260 359 L260 395" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="400" width="472" height="122" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="44" y="439" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#edbc69" font-weight="700">3  Acknowledge</text><text x="44" y="476" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Say “queued” after admission</text><path d="M260 524 L260 560" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="565" width="472" height="122" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="44" y="604" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6dd6dd" font-weight="700">4  Keep talking</text><text x="44" y="641" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Observed status; work continues</text><path d="M260 689 L260 725" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="730" width="472" height="122" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="44" y="769" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#91d5ad" font-weight="700">5  Check result</text><text x="44" y="806" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Scope, revision and generation</text><path d="M260 854 L260 890" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="895" width="472" height="122" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="44" y="934" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#edbc69" font-weight="700">6  Present at a pause</text><text x="44" y="971" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9db3cb" font-weight="400">Name the question; keep caveats</text></svg>
