<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">Conversation controller and task authority</title><desc id="desc">Media links the user and speech frontend. The controller owns three routes: talk, authorized fast context, and consult through the governed agent. Only the agent executes effects and saves receipts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#9db3cb" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" fill="#0a1628"/><text x="36" y="48" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#6dd6dd" font-weight="700">ONE CONVERSATION. ONE EFFECT OWNER.</text><rect x="36" y="96" width="360" height="120" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="56" y="135" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#6dd6dd" font-weight="700">User interface</text><text x="56" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9db3cb" font-weight="400">Microphone, speaker, text</text><rect x="704" y="96" width="360" height="120" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="724" y="135" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#6dd6dd" font-weight="700">Speech frontend</text><text x="724" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9db3cb" font-weight="400">Listen, yield, speak</text><path d="M420 153 L680 153" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M680 170 L420 170" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="137" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9db3cb" font-weight="400">Media</text><path d="M216 218 L216 270" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M884 218 L884 270" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="290" width="1028" height="142" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="56" y="329" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#edbc69" font-weight="700">Conversation controller</text><text x="56" y="366" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#9db3cb" font-weight="400">Accepted requests, revisions, tickets, result scheduling</text><text x="56" y="398" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#9db3cb" font-weight="400">Captions, task board and exact approval sheets</text><path d="M216 270 L216 290" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M884 270 L884 290" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M196 434 L196 495" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="495" width="320" height="148" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="56" y="534" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#6dd6dd" font-weight="700">Talk</text><text x="56" y="571" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9db3cb" font-weight="400">Greeting and clarification</text><text x="56" y="603" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9db3cb" font-weight="400">No business effects</text><path d="M550 434 L550 495" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="495" width="320" height="148" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="410" y="534" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#edbc69" font-weight="700">Fast</text><text x="410" y="571" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9db3cb" font-weight="400">Authorized observations</text><text x="410" y="603" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9db3cb" font-weight="400">Scope, source, freshness</text><path d="M904 434 L904 495" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="744" y="495" width="320" height="148" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="764" y="534" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#91d5ad" font-weight="700">Consult</text><text x="764" y="571" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9db3cb" font-weight="400">Governed agent</text><text x="764" y="603" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9db3cb" font-weight="400">Policy, tasks, effects</text><path d="M904 645 L904 698" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="700" width="674" height="106" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="410" y="739" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#91d5ad" font-weight="700">Durable requests and receipts</text></svg>
