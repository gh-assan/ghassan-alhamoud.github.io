<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">Durable ticket flow</title><desc id="desc">Accept a request. Admit stable identity. Acknowledge the durable ticket. Keep talking while work runs. Check the result and present it at a suitable pause.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#9db3cb" stroke-width="1.5"/></marker></defs><rect width="1100" height="850" fill="#0a1628"/><text x="36" y="48" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#edbc69" font-weight="700">ACKNOWLEDGE THE STATE YOU REACHED</text><text x="36" y="129" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#6dd6dd" font-weight="700">1  Accept</text><rect x="330" y="90" width="734" height="92" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="350" y="129" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#6dd6dd" font-weight="700">Resolve target and revision</text><path d="M700 184 L700 201" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="244" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#91d5ad" font-weight="700">2  Admit</text><rect x="330" y="205" width="734" height="92" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="350" y="244" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#91d5ad" font-weight="700">Backend stores request → ticket</text><path d="M700 299 L700 316" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="359" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#edbc69" font-weight="700">3  Acknowledge</text><rect x="330" y="320" width="734" height="92" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="350" y="359" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#edbc69" font-weight="700">Say “queued” after durable admission</text><path d="M700 414 L700 431" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="474" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#6dd6dd" font-weight="700">4  Keep talking</text><rect x="330" y="435" width="734" height="92" rx="12" fill="#102239" stroke="#6dd6dd" stroke-width="1.5"/><text x="350" y="474" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#6dd6dd" font-weight="700">Use observed status while work runs</text><path d="M700 529 L700 546" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="589" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#91d5ad" font-weight="700">5  Check result</text><rect x="330" y="550" width="734" height="92" rx="12" fill="#102239" stroke="#91d5ad" stroke-width="1.5"/><text x="350" y="589" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#91d5ad" font-weight="700">Current scope, revision and generation</text><path d="M700 644 L700 661" fill="none" stroke="#9db3cb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="704" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#edbc69" font-weight="700">6  Present at a pause</text><rect x="330" y="665" width="734" height="92" rx="12" fill="#102239" stroke="#edbc69" stroke-width="1.5"/><text x="350" y="704" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#edbc69" font-weight="700">Name the question; preserve uncertainty</text><text x="36" y="815" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#9db3cb" font-weight="400">The task record survives interruption, silence and media reconnect.</text></svg>
