<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">Which test could tell the causes apart?</title><desc id="desc">Reasoning model built from the recorded fan incident. Six candidate causes against five tests; each cell is what the test would show if that cause were the only fault. The raw full-power sketch showed no rotation and only rules out the firmware path and startup torque. A meter across the motor, proposed but never run, would read about 0 V under supply, ground and wiring faults alike. The motor spinning on its supply rules out the motor and leads. Comparing jumpers with the pin map confirms a wiring fault. Rewiring alone fixing the fan rules out supply and ground as additional faults.</desc>
