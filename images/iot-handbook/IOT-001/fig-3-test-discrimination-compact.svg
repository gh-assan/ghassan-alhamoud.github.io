<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1120" role="img" aria-labelledby="title desc">
<title id="title">Which test could tell the causes apart? — compact view</title><desc id="desc">Reasoning model built from the recorded fan incident. Six candidate causes against five tests; each cell is what the test would show if that cause were the only fault. The raw full-power sketch showed no rotation and only rules out the firmware path and startup torque. A meter across the motor, proposed but never run, would read about 0 V under supply, ground and wiring faults alike. The motor spinning on its supply rules out the motor and leads. Comparing jumpers with the pin map confirms a wiring fault. Rewiring alone fixing the fan rules out supply and ground as additional faults.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style><defs>
<marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d6f42"/></marker>
<marker id="info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4a6741"/></marker>
</defs>
<rect x="1" y="1" width="398" height="1118" rx="18" fill="#ffffff" stroke="#b0c4b0" stroke-width="1.4"/>
<text x="20" y="34" font-size="14" font-weight="700" fill="#1d6f42" text-anchor="start">03 / REASONING MODEL</text>
<text x="20" y="68" font-size="25" font-weight="450" fill="#1a2e1a" text-anchor="start">Which test could tell</text>
<text x="20" y="99" font-size="25" font-weight="450" fill="#1a2e1a" text-anchor="start">the causes apart?</text>
<text x="20" y="132" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">Six suspects: firmware path, torque, motor,</text>
<text x="20" y="153" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">supply, ground, input wiring.</text>
<rect x="20" y="180" width="360" height="152" rx="10" fill="#f5f7f5" stroke="#b0c4b0" stroke-width="1.4"/>
<text x="34" y="210" font-size="18" font-weight="650" fill="#1a2e1a" text-anchor="start">1 · Raw sketch, full power</text>
<text x="34" y="234" font-size="14" font-weight="500" fill="#4a6741" text-anchor="start">ran · 9 Sep</text>
<text x="34" y="264" font-size="14" font-weight="700" fill="#1d6f42" text-anchor="start">OBSERVED</text>
<text x="130" y="264" font-size="16" font-weight="500" fill="#1d6f42" text-anchor="start" class="mono">still</text>
<text x="34" y="292" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">Rules out firmware path and startup</text>
<text x="34" y="313" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">torque. Four causes predicted “still”.</text>
<rect x="20" y="350" width="360" height="152" rx="10" fill="#f5f7f5" stroke="#b0c4b0" stroke-width="1.4"/>
<text x="34" y="380" font-size="18" font-weight="650" fill="#1a2e1a" text-anchor="start">2 · Meter across motor</text>
<text x="34" y="404" font-size="14" font-weight="500" fill="#b45309" text-anchor="start">proposed · not run</text>
<text x="34" y="434" font-size="14" font-weight="700" fill="#1d6f42" text-anchor="start">OBSERVED</text>
<text x="130" y="434" font-size="16" font-weight="500" fill="#1d6f42" text-anchor="start" class="mono">—</text>
<text x="34" y="462" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">Would read ~0 V under supply, ground</text>
<text x="34" y="483" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">and wiring faults alike.</text>
<rect x="20" y="520" width="360" height="152" rx="10" fill="#f5f7f5" stroke="#b0c4b0" stroke-width="1.4"/>
<text x="34" y="550" font-size="18" font-weight="650" fill="#1a2e1a" text-anchor="start">3 · Motor on supply</text>
<text x="34" y="574" font-size="14" font-weight="500" fill="#4a6741" text-anchor="start">ran · 9 Sep</text>
<text x="34" y="604" font-size="14" font-weight="700" fill="#1d6f42" text-anchor="start">OBSERVED</text>
<text x="130" y="604" font-size="16" font-weight="500" fill="#1d6f42" text-anchor="start" class="mono">spins</text>
<text x="34" y="632" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">Rules out motor and leads.</text>
<text x="34" y="653" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start"></text>
<rect x="20" y="690" width="360" height="152" rx="10" fill="#f5f7f5" stroke="#b0c4b0" stroke-width="1.4"/>
<text x="34" y="720" font-size="18" font-weight="650" fill="#1a2e1a" text-anchor="start">4 · Jumpers vs pin map</text>
<text x="34" y="744" font-size="14" font-weight="500" fill="#4a6741" text-anchor="start">ran · 9 Sep</text>
<text x="34" y="774" font-size="14" font-weight="700" fill="#1d6f42" text-anchor="start">OBSERVED</text>
<text x="130" y="774" font-size="16" font-weight="500" fill="#1d6f42" text-anchor="start" class="mono">mismatch</text>
<text x="34" y="802" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">Confirms a wiring fault; others could</text>
<text x="34" y="823" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">still coexist.</text>
<rect x="20" y="860" width="360" height="152" rx="10" fill="#f5f7f5" stroke="#b0c4b0" stroke-width="1.4"/>
<text x="34" y="890" font-size="18" font-weight="650" fill="#1a2e1a" text-anchor="start">5 · Rewire, then run</text>
<text x="34" y="914" font-size="14" font-weight="500" fill="#4a6741" text-anchor="start">ran · 9 Sep</text>
<text x="34" y="944" font-size="14" font-weight="700" fill="#1d6f42" text-anchor="start">OBSERVED</text>
<text x="130" y="944" font-size="16" font-weight="500" fill="#1d6f42" text-anchor="start" class="mono">spins</text>
<text x="34" y="972" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">Rules out supply and ground as</text>
<text x="34" y="993" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">additional faults.</text>
<text x="20" y="1050" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">Each test: what it would show if that</text>
<text x="20" y="1072" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">cause were the only fault.</text>
</svg>
