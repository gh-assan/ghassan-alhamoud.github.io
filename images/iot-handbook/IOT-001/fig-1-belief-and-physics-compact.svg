<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1030" role="img" aria-labelledby="title desc">
<title id="title">Belief and physics — compact view</title><desc id="desc">Illustrative local LED control loop. DHT11 senses air temperature and creates a reading. The controller compares 26.3 C with a 26.0 C threshold and commands D9 high. The pin drives current through the LED only if the wiring connects it. A light sensor or human observes emitted light. Compare that observation with the command; pin readback alone cannot establish light. The observer shares board failures if read by the same board.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style><defs>
<marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d6f42"/></marker>
<marker id="info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker>
<marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4a6741"/></marker>
</defs>
<rect x="1" y="1" width="398" height="1028" rx="18" fill="#ffffff" stroke="#b0c4b0" stroke-width="1.4"/>
<text x="20" y="33" font-size="14" font-weight="700" fill="#1d6f42" text-anchor="start">01 / ILLUSTRATIVE</text>
<text x="20" y="65" font-size="23" font-weight="450" fill="#1a2e1a" text-anchor="start">A command crosses down.</text>
<text x="20" y="94" font-size="23" font-weight="450" fill="#1a2e1a" text-anchor="start">Evidence comes back.</text>
<text x="20" y="136" font-size="14" font-weight="700" fill="#1d6f42" text-anchor="start">SOFTWARE</text>
<text x="218" y="136" font-size="14" font-weight="700" fill="#0e7490" text-anchor="start">PHYSICS</text>
<rect x="16" y="150" width="171" height="690" rx="10" fill="#f5f7f5"/>
<rect x="213" y="150" width="171" height="690" rx="10" fill="#edf4f6"/>
<g data-card="Reading" data-bounds="25,165,153,94">
<rect x="25" y="165" width="153" height="94" rx="10" fill="#ffffff" stroke="#1d6f42" stroke-width="1.4"/>
<text x="41" y="194" font-size="17" font-weight="650" fill="#1a2e1a" text-anchor="start">Reading</text>
<text x="41" y="218" font-size="14" font-weight="450" fill="#4a6741" text-anchor="start">26.3 °C · valid</text>
</g>
<g data-card="DHT11" data-bounds="222,165,153,94">
<rect x="222" y="165" width="153" height="94" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.4"/>
<text x="238" y="194" font-size="17" font-weight="650" fill="#1a2e1a" text-anchor="start">DHT11</text>
<text x="238" y="218" font-size="14" font-weight="450" fill="#4a6741" text-anchor="start">air → sensor</text>
</g>
<path d="M222 216H181" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#info)"/>
<text x="202" y="196" font-size="16" font-weight="650" fill="#0e7490" text-anchor="middle">①</text>
<g data-card="Decision" data-bounds="25,299,153,94">
<rect x="25" y="299" width="153" height="94" rx="10" fill="#ffffff" stroke="#1d6f42" stroke-width="1.4"/>
<text x="41" y="328" font-size="17" font-weight="650" fill="#1a2e1a" text-anchor="start">Decision</text>
<text x="41" y="352" font-size="14" font-weight="450" fill="#4a6741" text-anchor="start">threshold 26.0</text>
</g>
<path d="M101 259V296" fill="none" stroke="#1d6f42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/>
<g data-card="Command" data-bounds="25,433,153,94">
<rect x="25" y="433" width="153" height="94" rx="10" fill="#ffffff" stroke="#1d6f42" stroke-width="1.4"/>
<text x="41" y="462" font-size="17" font-weight="650" fill="#1a2e1a" text-anchor="start">Command</text>
<text x="41" y="486" font-size="14" font-weight="450" fill="#4a6741" text-anchor="start">D9.Set(true)</text>
</g>
<path d="M101 393V430" fill="none" stroke="#1d6f42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/>
<g data-card="D9 pin" data-bounds="222,433,153,94">
<rect x="222" y="433" width="153" height="94" rx="10" fill="#ffffff" stroke="#1d6f42" stroke-width="1.4"/>
<text x="238" y="462" font-size="17" font-weight="650" fill="#1a2e1a" text-anchor="start">D9 pin</text>
<text x="238" y="486" font-size="14" font-weight="450" fill="#4a6741" text-anchor="start">HIGH ≠ light</text>
</g>
<path d="M178 480H219" fill="none" stroke="#1d6f42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/>
<text x="200" y="460" font-size="16" font-weight="650" fill="#1d6f42" text-anchor="middle">②</text>
<g data-card="LED" data-bounds="222,567,153,94">
<rect x="222" y="567" width="153" height="94" rx="10" fill="#ffffff" stroke="#1d6f42" stroke-width="1.4"/>
<text x="238" y="596" font-size="17" font-weight="650" fill="#1a2e1a" text-anchor="start">LED</text>
<text x="238" y="620" font-size="14" font-weight="450" fill="#4a6741" text-anchor="start">current → light</text>
</g>
<path d="M298 527V564" fill="none" stroke="#1d6f42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/>
<g data-card="Observer" data-bounds="222,701,153,94">
<rect x="222" y="701" width="153" height="94" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.4"/>
<text x="238" y="730" font-size="17" font-weight="650" fill="#1a2e1a" text-anchor="start">Observer</text>
<text x="238" y="754" font-size="14" font-weight="450" fill="#4a6741" text-anchor="start">light sensor / eye</text>
</g>
<path d="M298 661V698" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#info)"/>
<g data-card="Observation" data-bounds="25,701,153,94">
<rect x="25" y="701" width="153" height="94" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.4"/>
<text x="41" y="730" font-size="17" font-weight="650" fill="#1a2e1a" text-anchor="start">Observation</text>
<text x="41" y="754" font-size="14" font-weight="450" fill="#4a6741" text-anchor="start">lit / dark / ?</text>
</g>
<path d="M222 748H181" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#info)"/>
<text x="202" y="728" font-size="16" font-weight="650" fill="#0e7490" text-anchor="middle">③</text>
<g data-card="Compare evidence" data-bounds="25,817,350,46">
<rect x="25" y="817" width="350" height="46" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.4"/>
<text x="41" y="846" font-size="20" font-weight="650" fill="#1a2e1a" text-anchor="start">Compare evidence</text>
</g>
<path d="M101 795V814" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#info)"/>
<path d="M25 480H9V840H22" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#info)"/>
<rect x="20" y="894" width="360" height="111" rx="10" fill="#f5f7f5"/>
<text x="36" y="922" font-size="18" font-weight="650" fill="#1a2e1a" text-anchor="start">Compare command + observation.</text>
<text x="36" y="952" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">A pin readback only tells you about the pin.</text>
<text x="36" y="975" font-size="15" font-weight="450" fill="#4a6741" text-anchor="start">Physical light needs physical evidence.</text>
</svg>
