<path d="M374 897H389V194H377" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#warn)"/>
<text x="20" y="1144" font-size="17" font-weight="600" fill="#b45309" text-anchor="start">Feedback returns physical observations.</text>
<text x="20" y="1184" font-size="17" font-weight="450" fill="#4a6741" text-anchor="start">Roles can share one machine.</text>
<text x="20" y="1210" font-size="17" font-weight="450" fill="#4a6741" text-anchor="start">A sensor-only system needs no actuator.</text>
<text x="20" y="1236" font-size="17" font-weight="450" fill="#4a6741" text-anchor="start">The local lab isolates the control loop.</text>
<text x="20" y="1262" font-size="17" font-weight="450" fill="#4a6741" text-anchor="start">This is not an implemented product bridge.</text>
