<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1345" role="img" aria-labelledby="title desc">
<title id="title">IoT architecture — compact view</title><desc id="desc">Illustrative networked IoT architecture. Sensor and firmware publish readings over a transport to a gateway and event processing. History storage is a separate branch. An optional decision uses events and context and sends a bounded command back to local control, which drives an actuator. Physical feedback is sensed, returning evidence about the effect. A sensor-only system needs no command path. Roles may share a machine; the local lab uses only sensor, local control, actuator and observation. No Tamoz or Agentic Stream connector implementation is claimed.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style><defs>
