<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img"><title>Illustrative measurement age: measured at zero, received at nine, evaluated at ten seconds</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3dd68c"/></marker></defs><rect width="920" height="350" rx="16" fill="#0d0d0d"/><text x="24" y="36" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ff1a82" text-anchor="start" font-weight="700">TIME VIEW · CONSTRUCTED VALUES</text><text x="24" y="65" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#f0f0f0" text-anchor="start" font-weight="700">Delivery does not reset age</text><rect x="24" y="112" width="256" height="90" rx="7" fill="#161616" stroke="#252525"/><text x="40" y="141" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">12:00:00 · Measured</text><text x="40" y="164" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Observation age begins</text><rect x="332" y="112" width="256" height="90" rx="7" fill="#161616" stroke="#252525"/><text x="348" y="141" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">12:00:09 · Received</text><text x="348" y="164" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Already 9 seconds old</text><rect x="640" y="112" width="256" height="90" rx="7" fill="#161616" stroke="#252525"/><text x="656" y="141" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">12:00:10 · Evaluated</text><text x="656" y="164" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Age is 10 seconds</text><path d="M284 156 L326 156" stroke="#3dd68c" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><path d="M592 156 L634 156" stroke="#3dd68c" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><path d="M24 235 H896 M24 228 V242 M460 225 V245 M896 228 V242" stroke="#252525" fill="none"/><text x="24" y="261" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">0 s · Measured</text><text x="460" y="261" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#ff1a82" text-anchor="middle" font-weight="400">5 s · Assumed limit</text><text x="896" y="261" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="end" font-weight="400">10 s · Evaluated</text><text x="24" y="293" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#3dd68c" text-anchor="start" font-weight="400">Too old for the current-condition decision; may still support historical analysis.</text></svg>
