<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1510" role="img" aria-labelledby="title desc">
<title id="title">Fan incident — compact evidence timeline</title><desc id="desc">Historical operator-observed evidence from round-008, 8–9 September 2026. Four governed commands on 8 September and two on 9 September reported executed and energized, but the fan did not rotate. The raw diagnostic kept the same pin map and also failed. Direct supply connection produced rotation. Correcting direction-input jumpers from D4/D3 to D6/D7 produced seen and heard rotation. Earlier mismatched wiring is known retrospectively, not a contemporaneous measurement. No tachometer was fitted.</desc>
