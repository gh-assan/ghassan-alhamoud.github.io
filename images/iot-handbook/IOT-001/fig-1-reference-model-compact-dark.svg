<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" role="img"><title>Functional layers with cross-layer management and security</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3dd68c"/></marker></defs><rect width="360" height="580" rx="16" fill="#0d0d0d"/><text x="24" y="36" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ff1a82" text-anchor="start" font-weight="700">FUNCTIONAL VIEW</text><text x="24" y="65" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#f0f0f0" text-anchor="start" font-weight="700">Capabilities, not machines</text><rect x="16" y="80" width="328" height="370" rx="9" fill="none" stroke="#ff1a82" stroke-width="1.5"/><text x="32" y="109" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ff1a82" text-anchor="start" font-weight="700">MANAGEMENT + SECURITY</text><text x="32" y="133" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Across every layer</text><rect x="32" y="152" width="296" height="62" rx="7" fill="#161616" stroke="#252525"/><text x="48" y="181" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">Application</text><text x="48" y="204" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Purpose and user-facing behavior</text><rect x="32" y="224" width="296" height="62" rx="7" fill="#161616" stroke="#252525"/><text x="48" y="253" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">Service support and</text><text x="48" y="276" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">application support</text><rect x="32" y="296" width="296" height="62" rx="7" fill="#161616" stroke="#252525"/><text x="48" y="325" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">Network</text><text x="48" y="348" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Communication capabilities</text><rect x="32" y="368" width="296" height="62" rx="7" fill="#161616" stroke="#252525"/><text x="48" y="397" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">Device</text><text x="48" y="420" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Device and gateway capabilities</text><text x="24" y="488" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Four functional layers; one shared</text><text x="24" y="511" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">management and security responsibility.</text><text x="24" y="541" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="400">ITU-T Y.4000 / Y.2060, §8</text><text x="24" y="561" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#a8a8a8" text-anchor="start" font-weight="400">Author-drawn paraphrase</text></svg>
