<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 636" role="img"><title>Measurement and telemetry; optional commands and actuation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8cd8c3"/></marker></defs><rect width="360" height="636" rx="16" fill="#101923"/><text x="24" y="36" font-family="Arial, sans-serif" font-size="13" fill="#9eb7ff" text-anchor="start" font-weight="700">FLOW VIEW · ILLUSTRATIVE</text><text x="24" y="66" font-family="Arial, sans-serif" font-size="19" fill="#edf3fa" text-anchor="start" font-weight="700">Information and physical effects</text><rect x="24" y="98" width="312" height="82" rx="9" fill="#192735" stroke="#52687d"/><text x="40" y="127" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">Physical condition</text><text x="40" y="150" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Quantity of interest</text><rect x="24" y="226" width="312" height="82" rx="9" fill="#192735" stroke="#52687d"/><text x="40" y="255" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">Device</text><text x="40" y="278" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Sensing; optional actuation</text><rect x="24" y="354" width="312" height="82" rx="9" fill="#192735" stroke="#52687d"/><text x="40" y="383" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">Application</text><text x="40" y="406" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Uses information; may request action</text><path d="M104 182 L104 223" stroke="#8cd8c3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="116" y="207" font-family="Arial, sans-serif" font-size="13" fill="#8cd8c3" text-anchor="start" font-weight="400">Measurement</text><path d="M104 310 L104 350" stroke="#8cd8c3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="116" y="335" font-family="Arial, sans-serif" font-size="13" fill="#8cd8c3" text-anchor="start" font-weight="400">Telemetry via network</text><path d="M297 352 L297 310" stroke="#8cd8c3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="475" font-family="Arial, sans-serif" font-size="15" fill="#9eb7ff" text-anchor="start" font-weight="400">Optional return: command</text><text x="24" y="503" font-family="Arial, sans-serif" font-size="15" fill="#9eb7ff" text-anchor="start" font-weight="400">Optional effect: actuation</text><text x="24" y="544" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Feedback uses a relevant observation.</text><text x="24" y="572" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">No actuator is needed for monitoring.</text><text x="24" y="600" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Arrows describe roles, not timing.</text></svg>
