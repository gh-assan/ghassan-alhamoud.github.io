<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 636" role="img"><title>Measurement and telemetry; optional commands and actuation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/></marker></defs><rect width="360" height="636" rx="16" fill="#f5f7f5"/><text x="24" y="36" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d6f42" text-anchor="start" font-weight="700">FLOW VIEW · ILLUSTRATIVE</text><text x="24" y="66" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="19" fill="#1a2e1a" text-anchor="start" font-weight="700">Information and physical effects</text><rect x="24" y="98" width="312" height="82" rx="7" fill="#edf2ed" stroke="#b0c4b0"/><text x="40" y="127" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#1a2e1a" text-anchor="start" font-weight="400">Physical condition</text><text x="40" y="150" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">Quantity of interest</text><rect x="24" y="226" width="312" height="82" rx="7" fill="#edf2ed" stroke="#b0c4b0"/><text x="40" y="255" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#1a2e1a" text-anchor="start" font-weight="400">Device</text><text x="40" y="278" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">Sensing; optional actuation</text><rect x="24" y="354" width="312" height="82" rx="7" fill="#edf2ed" stroke="#b0c4b0"/><text x="40" y="383" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#1a2e1a" text-anchor="start" font-weight="400">Application</text><text x="40" y="406" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">Uses information; may request action</text><path d="M52 182 L52 223" stroke="#0e7490" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><text x="92" y="207" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d6f42" text-anchor="middle" font-weight="400">Measure</text><path d="M308 223 L308 182" stroke="#0e7490" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><text x="264" y="207" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d6f42" text-anchor="middle" font-weight="400">Actuate*</text><path d="M52 310 L52 350" stroke="#0e7490" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><text x="97" y="335" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d6f42" text-anchor="middle" font-weight="400">Telemetry</text><path d="M308 352 L308 310" stroke="#0e7490" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><text x="262" y="335" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d6f42" text-anchor="middle" font-weight="400">Command*</text><text x="24" y="475" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#1d6f42" text-anchor="start" font-weight="400">* Optional return paths</text><text x="24" y="503" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#0e7490" text-anchor="start" font-weight="400">Feedback follows a new observation.</text><text x="24" y="544" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">Feedback uses a relevant observation.</text><text x="24" y="572" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">No actuator is needed for monitoring.</text><text x="24" y="600" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">Arrows descri