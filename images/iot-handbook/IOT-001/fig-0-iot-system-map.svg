<path d="M943 271V310H681V399" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#info)"/>
<text x="640" y="335" font-size="15" font-weight="450" fill="#0e7490" text-anchor="start">events + context</text>
<path d="M572 440H531" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#info)"/>
<path d="M310 440H269" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#info)"/>
<text x="220" y="384" font-size="13" font-weight="700" fill="#0e7490" text-anchor="start">BOUNDED COMMANDS</text>
<path d="M157 474V544H22V219H45" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#warn)"/>
<text x="48" y="575" font-size="18" font-weight="600" fill="#b45309" text-anchor="start">Feedback: observe the physical quantity or effect; do not substitute a delivery ack.</text>
<rect x="32" y="608" width="1036" height="120" rx="10" fill="#f5f7f5"/>
<text x="52" y="639" font-size="21" font-weight="650" fill="#1a2e1a" text-anchor="start">These are roles, not mandatory servers.</text>
<text x="52" y="667" font-size="17" font-weight="450" fill="#4a6741" text-anchor="start">A sensor-only logger uses the top journey. Local control can work without a cloud.</text>
<text x="52" y="691" font-size="17" font-weight="450" fill="#4a6741" text-anchor="start">The Chapter 1 lab isolates sensing, control, actuation and observation over USB.</text>
<text x="52" y="715" font-size="17" font-weight="450" fill="#4a6741" text-anchor="start">This map proposes an arrangement; it does not assert an implemented product bridge.</text>
</svg>
