<rect x="1" y="1" width="1098" height="758" rx="18" fill="#ffffff" stroke="#b0c4b0" stroke-width="1.4"/>
<text x="32" y="35" font-size="13" font-weight="700" fill="#1d6f42" text-anchor="start">00 / SYSTEM MAP · ILLUSTRATIVE</text>
<text x="32" y="72" font-size="28" font-weight="650" fill="#1a2e1a" text-anchor="start">The full system has two journeys.</text>
<text x="32" y="100" font-size="16" font-weight="450" fill="#4a6741" text-anchor="start">Readings travel out. Optional commands return. Physical evidence closes the loop.</text>
