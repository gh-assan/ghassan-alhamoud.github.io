<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img"><title>Illustrative measurement age: measured at zero, received at nine, evaluated at ten seconds</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8cd8c3"/></marker></defs><rect width="360" height="500" rx="16" fill="#101923"/><text x="24" y="36" font-family="Arial, sans-serif" font-size="13" fill="#9eb7ff" text-anchor="start" font-weight="700">TIME VIEW · CONSTRUCTED VALUES</text><text x="24" y="65" font-family="Arial, sans-serif" font-size="20" fill="#edf3fa" text-anchor="start" font-weight="700">Delivery does not reset age</text><rect x="24" y="92" width="312" height="80" rx="9" fill="#192735" stroke="#52687d"/><text x="40" y="121" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">12:00:00 · Measured</text><text x="40" y="144" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Observation age begins</text><rect x="24" y="198" width="312" height="80" rx="9" fill="#192735" stroke="#52687d"/><text x="40" y="227" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">12:00:09 · Received</text><text x="40" y="250" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Already 9 seconds old</text><rect x="24" y="304" width="312" height="80" rx="9" fill="#192735" stroke="#52687d"/><text x="40" y="333" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">12:00:10 · Evaluated</text><text x="40" y="356" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Age is 10 seconds</text><path d="M46 176 L46 192" stroke="#8cd8c3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M46 282 L46 298" stroke="#8cd8c3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="434" font-family="Arial, sans-serif" font-size="15" fill="#afbecf" text-anchor="start" font-weight="400">Assumed maximum age: 5 seconds</text><text x="24" y="465" font-family="Arial, sans-serif" font-size="15" fill="#8cd8c3" text-anchor="start" font-weight="400">Too old for this current-condition use</text></svg>
