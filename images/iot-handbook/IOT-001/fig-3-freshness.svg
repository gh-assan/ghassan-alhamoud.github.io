<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img"><title>Illustrative measurement age: measured at zero, received at nine, evaluated at ten seconds</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8cd8c3"/></marker></defs><rect width="920" height="350" rx="16" fill="#101923"/><text x="24" y="36" font-family="Arial, sans-serif" font-size="13" fill="#9eb7ff" text-anchor="start" font-weight="700">TIME VIEW · CONSTRUCTED VALUES</text><text x="24" y="65" font-family="Arial, sans-serif" font-size="20" fill="#edf3fa" text-anchor="start" font-weight="700">Delivery does not reset age</text><rect x="24" y="112" width="256" height="90" rx="9" fill="#192735" stroke="#52687d"/><text x="40" y="141" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">12:00:00 · Measured</text><text x="40" y="164" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Observation age begins</text><rect x="332" y="112" width="256" height="90" rx="9" fill="#192735" stroke="#52687d"/><text x="348" y="141" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">12:00:09 · Received</text><text x="348" y="164" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Already 9 seconds old</text><rect x="640" y="112" width="256" height="90" rx="9" fill="#192735" stroke="#52687d"/><text x="656" y="141" font-family="Arial, sans-serif" font-size="16" fill="#edf3fa" text-anchor="start" font-weight="400">12:00:10 · Evaluated</text><text x="656" y="164" font-family="Arial, sans-serif" font-size="14" fill="#afbecf" text-anchor="start" font-weight="400">Age is 10 seconds</text><path d="M284 156 L326 156" stroke="#8cd8c3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M592 156 L634 156" stroke="#8cd8c3" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="24" y="255" font-family="Arial, sans-serif" font-size="16" fill="#afbecf" text-anchor="start" font-weight="400">Assumed maximum age: 5 seconds · Synchronized clocks for this exercise</text><text x="24" y="293" font-family="Arial, sans-serif" font-size="16" fill="#8cd8c3" text-anchor="start" font-weight="400">Too old for the current-condition decision; may still support historical analysis.</text></svg>
