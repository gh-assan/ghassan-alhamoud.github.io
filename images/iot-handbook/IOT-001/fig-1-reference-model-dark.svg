<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 455" role="img"><title>Functional layers with cross-layer management and security</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3dd68c"/></marker></defs><rect width="920" height="455" rx="16" fill="#0d0d0d"/><text x="24" y="36" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ff1a82" text-anchor="start" font-weight="700">FUNCTIONAL VIEW</text><text x="24" y="65" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#f0f0f0" text-anchor="start" font-weight="700">Capabilities, not machines</text><rect x="24" y="90" width="590" height="66" rx="7" fill="#161616" stroke="#252525"/><text x="40" y="119" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">Application</text><text x="40" y="142" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Purpose and user-facing behavior</text><rect x="24" y="168" width="590" height="66" rx="7" fill="#161616" stroke="#252525"/><text x="40" y="197" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">Service support and</text><text x="40" y="220" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">application support</text><rect x="24" y="246" width="590" height="66" rx="7" fill="#161616" stroke="#252525"/><text x="40" y="275" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#f0f0f0" text-anchor="start" font-weight="400">Network</text><text x="40" y="298" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#a8a8a8" text-anchor="start" font-weight="400">Communication