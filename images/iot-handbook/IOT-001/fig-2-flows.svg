<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 465" role="img"><title>Measurement and telemetry; optional commands and actuation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/></marker></defs><rect width="920" height="465" rx="16" fill="#f5f7f5"/><text x="24" y="36" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d6f42" text-anchor="start" font-weight="700">FLOW VIEW · ILLUSTRATIVE</text><text x="24" y="66" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="19" fill="#1a2e1a" text-anchor="start" font-weight="700">Information and physical effects</text><rect x="24" y="142" width="256" height="104" rx="7" fill="#edf2ed" stroke="#b0c4b0"/><text x="40" y="171" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#1a2e1a" text-anchor="start" font-weight="400">Physical condition</text><text x="40" y="194" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">Quantity of interest</text><rect x="332" y="142" width="256" height="104" rx="7" fill="#edf2ed" stroke="#b0c4b0"/><text x="348" y="171" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#1a2e1a" text-anchor="start" font-weight="400">Device</text><text x="348" y="194" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">Sensing; optional actuation</text><rect x="640" y="142" width="256" height="104" rx="7" fill="#edf2ed" stroke="#b0c4b0"/><text x="656" y="171" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#1a2e1a" text-anchor="start" font-weight="400">Application</text><text x="656" y="194" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#4a6741" text-anchor="start" font-weight="400">Uses information</text><path d="M281 166 L326 166" stroke="#0e7490" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><text x="281" y="128" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0e7490" text-anchor="start" font-weight="400">Measure</text><path d="M589 166 L635 166" stroke="#0e7490" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><text x="592" y="128" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#0e7490" text-anchor="start" font-weight="400">Telemetry</text><path d="M638 222 L594 222" stroke="#0e7490" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><text x="587" y="274" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d6f42" text-anchor="start" font-weight="400">Command*</text><path d="M330 222 L286 222" stroke="#0e7490" stroke-width="1.75" fill="none" marker-end="url(#arrow)"/><text x="273" y="274" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1d6f42" text-anchor="start" font-weight="400">Actuate*</text><text x="24" y="328" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#4a6741" text-anchor="start" font-weight="400">Telemetry and commands cross a communication network.</text><text x="24" y="359" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#4a6741" text-anchor="start" font-weight="400">* Optional. Sensing-only systems omit the actuation path.</text><text x="24" y="402" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#0e7490" text-anchor="start" font-weight="400">Feedback: a relevant observation informs a later decision.</text></svg>
