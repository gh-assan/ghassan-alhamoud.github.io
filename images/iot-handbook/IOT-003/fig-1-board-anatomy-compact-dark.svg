<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 648" role="img" aria-labelledby="title desc">
<title id="title">A board implements more than computation</title>
<desc id="desc">Five responsibilities: power, compute and memory, interfaces, clock and reset, and programming and debug. This is conceptual anatomy, not a circuit or wiring diagram.</desc>
<rect width="360" height="648" rx="8" fill="#0d0d0d"/>
<text x="22" y="32" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">WHAT THE BOARD IMPLEMENTS</text>
<text x="22" y="56" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Responsibilities may share a package.</text>
<rect x="22" y="82" width="316" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="36" y="107" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">Power</text>
<text x="36" y="130" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Regulate and distribute</text>
<text x="36" y="151" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Supply quality and limits</text>
<rect x="22" y="186" width="316" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="36" y="211" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">Compute + memory</text>
<text x="36" y="234" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Execute and retain state</text>
<text x="36" y="255" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Resources have owners</text>
<rect x="22" y="290" width="316" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="36" y="315" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">Physical interfaces</text>
<text x="36" y="338" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Connect to the outside</text>
<text x="36" y="359" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Pins, radio and protection</text>
<rect x="22" y="394" width="316" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="36" y="419" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">Clock + reset</text>
<text x="36" y="442" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Start, time and recover</text>
<text x="36" y="463" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Output behavior matters</text>
<rect x="22" y="498" width="316" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="36" y="523" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">Program + debug</text>
<text x="36" y="546" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Load and inspect software</text>
<text x="36" y="567" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Access is a design choice</text>
<text x="22" y="626" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Conceptual anatomy; not a wiring diagram.</text>
</svg>
