<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 774" role="img" aria-labelledby="title desc">
<title id="title">Who executes a CC2640R2F report</title>
<desc id="desc">Normal path: local input through driver into Cortex-M3 application and RAM, upper Bluetooth stack on the main CPU, dedicated RF subsystem, then nearby peer. Optional Sensor Controller work can wake the main CPU; it is separate from the normal path. This is a conceptual ownership diagram, not timing or wiring.</desc>
<rect width="360" height="774" rx="8" fill="#f5f7f5"/>
<text x="22" y="32" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a2e1a">FROM INPUT TO BLE PEER</text>
<text x="22" y="56" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">Main path: connected reporting example.</text>
<rect x="22" y="82" width="316" height="82" rx="7" fill="#edf2ed" stroke="#b0c4b0"/>
<text x="36" y="107" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a2e1a">Sensor / input</text>
<text x="36" y="130" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#1a2e1a">Local I²C connection</text>
<text x="36" y="151" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">Peripheral + driver</text>
<path d="M180,166 L180,184" fill="none" stroke="#1d6f42" stroke-width="1.5"/>
<polyline points="176,178 180,184 184,178" fill="none" stroke="#1d6f42" stroke-width="1.5"/>
<rect x="22" y="186" width="316" height="82" rx="7" fill="#edf2ed" stroke="#b0c4b0"/>
<text x="36" y="211" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a2e1a">Cortex-M3</text>
<text x="36" y="234" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#1a2e1a">Driver + application</text>
<text x="36" y="255" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">RAM + upper BLE</text>
<path d="M180,270 L180,288" fill="none" stroke="#1d6f42" stroke-width="1.5"/>
<polyline points="176,282 180,288 184,282" fill="none" stroke="#1d6f42" stroke-width="1.5"/>
<rect x="22" y="290" width="316" height="82" rx="7" fill="#edf2ed" stroke="#b0c4b0"/>
<text x="36" y="315" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a2e1a">RF subsystem</text>
<text x="36" y="338" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#1a2e1a">Radio timing + signals</text>
<text x="36" y="359" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">Dedicated Cortex-M0</text>
<path d="M180,374 L180,392" fill="none" stroke="#1d6f42" stroke-width="1.5"/>
<polyline points="176,386 180,392 184,386" fill="none" stroke="#1d6f42" stroke-width="1.5"/>
<rect x="22" y="394" width="316" height="82" rx="7" fill="#edf2ed" stroke="#b0c4b0"/>
<text x="36" y="419" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a2e1a">Nearby BLE peer</text>
<text x="36" y="442" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#1a2e1a">Gateway central/client</text>
<text x="36" y="463" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">Receive + process</text>
<rect x="22" y="548" width="316" height="82" rx="7" fill="#edf2ed" stroke="#b0c4b0"/>
<text x="36" y="573" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a2e1a">Optional Sensor Controller</text>
<text x="36" y="596" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#1a2e1a">Supported sensing work</text>
<text x="36" y="617" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">Can wake the main CPU</text>
<text x="22" y="666" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">Application code runs on the main CPU.</text>
<text x="22" y="692" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">RF core is not a spare application core.</text>
<text x="22" y="742" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#4a6741">Conceptual ownership; not measured timing.</text>
</svg>
