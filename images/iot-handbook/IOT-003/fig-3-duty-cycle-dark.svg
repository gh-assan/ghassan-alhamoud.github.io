<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" role="img" aria-labelledby="title desc">
<title id="title">A duty cycle includes activity and failure handling</title>
<desc id="desc">Sleep, acquire, buffer, attempt radio transfer, then sleep. If no link is available, follow bounded retry and queue policy before sleeping. Sending alone does not prove delivery. No measured timing is represented.</desc>
<rect width="900" height="346" rx="8" fill="#0d0d0d"/>
<text x="22" y="32" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">FOLLOW THE WHOLE CYCLE</text>
<text x="22" y="56" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Illustrative states; no measured timing.</text>
<rect x="22" y="92" width="160" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="36" y="117" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">1. Sleep</text>
<text x="36" y="140" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Wake event</text>
<text x="36" y="161" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Board loads</text>
<path d="M183,133 L195,133" fill="none" stroke="#ff1a82" stroke-width="1.5"/>
<polyline points="189,129 195,133 189,137" fill="none" stroke="#ff1a82" stroke-width="1.5"/>
<rect x="196" y="92" width="160" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="210" y="117" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">2. Acquire</text>
<text x="210" y="140" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Read input</text>
<text x="210" y="161" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Conversion</text>
<path d="M357,133 L369,133" fill="none" stroke="#ff1a82" stroke-width="1.5"/>
<polyline points="363,129 369,133 363,137" fill="none" stroke="#ff1a82" stroke-width="1.5"/>
<rect x="370" y="92" width="160" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="384" y="117" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">3. Buffer</text>
<text x="384" y="140" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Store record</text>
<text x="384" y="161" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Finite capacity</text>
<path d="M531,133 L543,133" fill="none" stroke="#ff1a82" stroke-width="1.5"/>
<polyline points="537,129 543,133 537,137" fill="none" stroke="#ff1a82" stroke-width="1.5"/>
<rect x="544" y="92" width="160" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="558" y="117" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">4. Radio attempt</text>
<text x="558" y="140" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Try link</text>
<text x="558" y="161" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Send ≠ delivery</text>
<path d="M705,133 L717,133" fill="none" stroke="#ff1a82" stroke-width="1.5"/>
<polyline points="711,129 717,133 711,137" fill="none" stroke="#ff1a82" stroke-width="1.5"/>
<rect x="718" y="92" width="160" height="82" rx="7" fill="#161616" stroke="#505050"/>
<text x="732" y="117" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#f0f0f0">5. Sleep again</text>
<text x="732" y="140" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Bound work</text>
<text x="732" y="161" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Queue policy</text>
<rect x="22" y="222" width="856" height="88" rx="7" fill="#161616" stroke="#505050" stroke-dasharray="5 4"/>
<text x="36" y="247" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#f0f0f0">IF THE LINK IS UNAVAILABLE</text>
<text x="36" y="271" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#f0f0f0">Bound retries, then return to sleep. Retain or explicitly drop queued data.</text>
<text x="36" y="294" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">An attempted transfer does not establish peer receipt or a physical effect.</text>
<text x="22" y="332" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="400" fill="#a8a8a8">Proposed state policy, not executed firmware.</text>
</svg>
