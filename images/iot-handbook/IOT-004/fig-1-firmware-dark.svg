<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="title desc">
<title id="title">Who owns the next step?</title><desc id="desc">A release hands work to acquisition. Driver completion produces a record copied into a bounded queue. Communication submits to BLE. UTC maps the acquisition timestamp and does not drive releases.</desc>
<rect width="920" height="720" rx="18" fill="#0d0d0d"/>
<text x="24" y="38" font-family="system-ui,sans-serif" font-size="20" fill="#ededed">Who owns the next step?</text>
<text x="24" y="68" font-family="system-ui,sans-serif" font-size="16" fill="#b3b3b3">Constructed teaching model</text>
<rect x="24" y="96" width="872" height="104" rx="10" fill="#171717" stroke="#5a5a5a"/>
<text x="40" y="124" font-family="system-ui,sans-serif" font-size="18" fill="#ededed">1. Release → acquisition owner</text>
<text x="40" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">Local elapsed schedule releases work.</text>
<text x="40" y="176" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">Start an operation with a bounded timeout.</text>
<rect x="24" y="212" width="872" height="104" rx="10" fill="#171717" stroke="#5a5a5a"/>
<text x="40" y="240" font-family="system-ui,sans-serif" font-size="18" fill="#ededed">2. Driver → acquisition owner</text>
<text x="40" y="267" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">Completion reports result and timing.</text>
<text x="40" y="292" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">Check status and fence obsolete results.</text>
<rect x="24" y="328" width="872" height="104" rx="10" fill="#171717" stroke="#5a5a5a"/>
<text x="40" y="356" font-family="system-ui,sans-serif" font-size="18" fill="#ededed">3. Acquisition → owned queue slot</text>
<text x="40" y="383" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">Copy value, sequence, boot and time.</text>
<text x="40" y="408" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">If full, apply policy and record the loss.</text>
<rect x="24" y="444" width="872" height="104" rx="10" fill="#171717" stroke="#5a5a5a"/>
<text x="40" y="472" font-family="system-ui,sans-serif" font-size="18" fill="#ededed">4. Queue → communication owner</text>
<text x="40" y="499" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">Submit when BLE capacity permits.</text>
<text x="40" y="524" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">Submission does not prove peer storage.</text>
<rect x="24" y="560" width="872" height="104" rx="10" fill="#171717" stroke="#5a5a5a"/>
<text x="40" y="588" font-family="system-ui,sans-serif" font-size="18" fill="#ededed">Separate: local time → UTC estimate</text>
<text x="40" y="615" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">Mapping labels the acquisition instant.</text>
<text x="40" y="640" font-family="system-ui,sans-serif" font-size="16" fill="#ededed">It does not determine local releases.</text>
<text x="24" y="698" font-family="system-ui,sans-serif" font-size="16" fill="#b3b3b3">Read the caption for assumptions and limits.</text>
</svg>
