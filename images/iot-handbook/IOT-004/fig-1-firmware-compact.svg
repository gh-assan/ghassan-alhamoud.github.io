<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" role="img" aria-labelledby="title desc">
<title id="title">Who owns the next step?</title><desc id="desc">A release hands work to acquisition. Driver completion produces a record copied into a bounded queue. Communication submits to BLE. UTC maps the acquisition timestamp and does not drive releases.</desc>
<rect width="440" height="720" rx="18" fill="#f4f7f2"/>
<text x="24" y="38" font-family="system-ui,sans-serif" font-size="20" fill="#1c301b">Who owns the next step?</text>
<text x="24" y="68" font-family="system-ui,sans-serif" font-size="16" fill="#45623b">Constructed teaching model</text>
<rect x="24" y="96" width="392" height="104" rx="10" fill="#e9f0e5" stroke="#afc2a5"/>
<text x="40" y="124" font-family="system-ui,sans-serif" font-size="18" fill="#284f30">1. Release → acquisition owner</text>
<text x="40" y="151" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">Local elapsed schedule releases work.</text>
<text x="40" y="176" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">Start an operation with a bounded timeout.</text>
<rect x="24" y="212" width="392" height="104" rx="10" fill="#e9f0e5" stroke="#afc2a5"/>
<text x="40" y="240" font-family="system-ui,sans-serif" font-size="18" fill="#284f30">2. Driver → acquisition owner</text>
<text x="40" y="267" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">Completion reports result and timing.</text>
<text x="40" y="292" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">Check status and fence obsolete results.</text>
<rect x="24" y="328" width="392" height="104" rx="10" fill="#e9f0e5" stroke="#afc2a5"/>
<text x="40" y="356" font-family="system-ui,sans-serif" font-size="18" fill="#284f30">3. Acquisition → owned queue slot</text>
<text x="40" y="383" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">Copy value, sequence, boot and time.</text>
<text x="40" y="408" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">If full, apply policy and record the loss.</text>
<rect x="24" y="444" width="392" height="104" rx="10" fill="#e9f0e5" stroke="#afc2a5"/>
<text x="40" y="472" font-family="system-ui,sans-serif" font-size="18" fill="#284f30">4. Queue → communication owner</text>
<text x="40" y="499" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">Submit when BLE capacity permits.</text>
<text x="40" y="524" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">Submission does not prove peer storage.</text>
<rect x="24" y="560" width="392" height="104" rx="10" fill="#e9f0e5" stroke="#afc2a5"/>
<text x="40" y="588" font-family="system-ui,sans-serif" font-size="18" fill="#284f30">Separate: local time → UTC estimate</text>
<text x="40" y="615" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">Mapping labels the acquisition instant.</text>
<text x="40" y="640" font-family="system-ui,sans-serif" font-size="16" fill="#1c301b">It does not determine local releases.</text>
<text x="24" y="698" font-family="system-ui,sans-serif" font-size="16" fill="#45623b">Read the caption for assumptions and limits.</text>
</svg>
