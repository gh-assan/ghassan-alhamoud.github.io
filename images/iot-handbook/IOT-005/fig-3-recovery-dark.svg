<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 729" role="img" aria-labelledby="title desc">
<title id="title">Drain history without starving live data</title><desc id="desc">Constructed model: 300 valid records accumulate during a 300-second outage from a recovered state. Effective service is three application-stored records per second: one live and two historical. Backlog is 150 after 75 seconds and zero after 150 seconds. Missing receipts retain records.</desc>
<style>svg{--bg:#0d0d0d;--card:#171717;--fg:#ededed;--muted:#b3b3b3;--line:#5a5a5a;--accent:#ededed}text{font-family:system-ui,sans-serif;fill:var(--fg)}</style>
<rect width="920" height="729" rx="18" fill="var(--bg)"/>
<text x="24" y="35" font-size="21">Drain history without starving live data</text>
<text x="24" y="94" font-size="17" style="fill:var(--muted)">Constructed architecture model</text>
<rect x="20" y="118" width="880" height="121" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="148" font-size="19" style="fill:var(--accent)">Outage: 300 seconds</text>
<text x="34" y="178" font-size="18">One valid record/s → 300 occupied slots. Capacity 360; endpoint power remains</text>
<text x="34" y="203" font-size="18">available.</text>
<text x="452" y="262" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="269" width="880" height="121" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="299" font-size="19" style="fill:var(--accent)">Reconnect: backlog 300</text>
<text x="34" y="329" font-size="18">Effective service 3/s: one live record, two historical records. Application receipts</text>
<text x="34" y="354" font-size="18">release slots.</text>
<text x="452" y="413" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="420" width="880" height="121" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="450" font-size="19" style="fill:var(--accent)">After 75 seconds: backlog 150</text>
<text x="34" y="480" font-size="18">Live acquisition continues. Historical identity and acquisition time remain</text>
<text x="34" y="505" font-size="18">unchanged.</text>
<text x="452" y="564" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="571" width="880" height="96" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="601" font-size="19" style="fill:var(--accent)">After 150 seconds: backlog 0</text>
<text x="34" y="631" font-size="18">Recovered steady state. If total service is only 1/s, the backlog cannot drain.</text>
<text x="24" y="711" font-size="17" style="fill:var(--muted)">Assumptions and limits in the caption.</text>
</svg>
