<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 854" role="img" aria-labelledby="title desc">
<title id="title">Drain history without starving live data</title><desc id="desc">Constructed model: 300 valid records accumulate during a 300-second outage from a recovered state. Effective service is three application-stored records per second: one live and two historical. Backlog is 150 after 75 seconds and zero after 150 seconds. Missing receipts retain records.</desc>
<style>svg{--bg:#f4f7f2;--card:#e9f0e5;--fg:#1c301b;--muted:#45623b;--line:#afc2a5;--accent:#284f30}text{font-family:system-ui,sans-serif;fill:var(--fg)}</style>
<rect width="440" height="854" rx="18" fill="var(--bg)"/>
<text x="24" y="35" font-size="21">Drain history without starving</text>
<text x="24" y="61" font-size="21">live data</text>
<text x="24" y="94" font-size="17" style="fill:var(--muted)">Constructed architecture model</text>
<rect x="20" y="118" width="400" height="146" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="148" font-size="19" style="fill:var(--accent)">Outage: 300 seconds</text>
<text x="34" y="178" font-size="18">One valid record/s → 300 occupied</text>
<text x="34" y="203" font-size="18">slots. Capacity 360; endpoint power</text>
<text x="34" y="228" font-size="18">remains available.</text>
<text x="212" y="287" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="294" width="400" height="146" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="324" font-size="19" style="fill:var(--accent)">Reconnect: backlog 300</text>
<text x="34" y="354" font-size="18">Effective service 3/s: one live record,</text>
<text x="34" y="379" font-size="18">two historical records. Application</text>
<text x="34" y="404" font-size="18">receipts release slots.</text>
<text x="212" y="463" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="470" width="400" height="146" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="500" font-size="19" style="fill:var(--accent)">After 75 seconds: backlog 150</text>
<text x="34" y="530" font-size="18">Live acquisition continues.</text>
<text x="34" y="555" font-size="18">Historical identity and acquisition</text>
<text x="34" y="580" font-size="18">time remain unchanged.</text>
<text x="212" y="639" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="646" width="400" height="146" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="676" font-size="19" style="fill:var(--accent)">After 150 seconds: backlog 0</text>
<text x="34" y="706" font-size="18">Recovered steady state. If total</text>
<text x="34" y="731" font-size="18">service is only 1/s, the backlog</text>
<text x="34" y="756" font-size="18">cannot drain.</text>
<text x="24" y="836" font-size="17" style="fill:var(--muted)">Assumptions and limits in the caption.</text>
</svg>
