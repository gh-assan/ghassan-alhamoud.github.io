<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 754" role="img" aria-labelledby="title desc">
<title id="title">Who owns the observation?</title><desc id="desc">Acquisition creates an immutable record. Storage retains it until gateway application receipt. Communication borrows it for transfer. Lifecycle and diagnostics supervise without sharing unrestricted writes.</desc>
<style>svg{--bg:#0d0d0d;--card:#171717;--fg:#ededed;--muted:#b3b3b3;--line:#5a5a5a;--accent:#ededed}text{font-family:system-ui,sans-serif;fill:var(--fg)}</style>
<rect width="920" height="754" rx="18" fill="var(--bg)"/>
<text x="24" y="35" font-size="21">Who owns the observation?</text>
<text x="24" y="94" font-size="17" style="fill:var(--muted)">Constructed architecture model</text>
<rect x="20" y="118" width="880" height="121" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="148" font-size="19" style="fill:var(--accent)">Acquisition owner</text>
<text x="34" y="178" font-size="18">Owns sensor operation and result lifetime. A timeout invalidates the operation</text>
<text x="34" y="203" font-size="18">before driver recovery.</text>
<text x="452" y="262" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="269" width="880" height="121" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="299" font-size="19" style="fill:var(--accent)">Record store</text>
<text x="34" y="329" font-size="18">Owns immutable value, identity and time. Capacity: 360 slots. Overflow is visible</text>
<text x="34" y="354" font-size="18">degraded service.</text>
<text x="452" y="413" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="420" width="880" height="121" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="450" font-size="19" style="fill:var(--accent)">Communication owner</text>
<text x="34" y="480" font-size="18">Borrows records. Current traffic has priority. Only application receipts permit</text>
<text x="34" y="505" font-size="18">reclamation.</text>
<text x="452" y="564" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="571" width="880" height="121" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="601" font-size="19" style="fill:var(--accent)">Lifecycle and diagnostics</text>
<text x="34" y="631" font-size="18">Own activation and recovery policy. Observe bounded evidence; do not overwrite</text>
<text x="34" y="656" font-size="18">records.</text>
<text x="24" y="736" font-size="17" style="fill:var(--muted)">Assumptions and limits in the caption.</text>
</svg>
