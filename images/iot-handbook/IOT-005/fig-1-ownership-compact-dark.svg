<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 854" role="img" aria-labelledby="title desc">
<title id="title">Who owns the observation?</title><desc id="desc">Acquisition creates an immutable record. Storage retains it until gateway application receipt. Communication borrows it for transfer. Lifecycle and diagnostics supervise without sharing unrestricted writes.</desc>
<style>svg{--bg:#0d0d0d;--card:#171717;--fg:#ededed;--muted:#b3b3b3;--line:#5a5a5a;--accent:#ededed}text{font-family:system-ui,sans-serif;fill:var(--fg)}</style>
<rect width="440" height="854" rx="18" fill="var(--bg)"/>
<text x="24" y="35" font-size="21">Who owns the observation?</text>
<text x="24" y="94" font-size="17" style="fill:var(--muted)">Constructed architecture model</text>
<rect x="20" y="118" width="400" height="146" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="148" font-size="19" style="fill:var(--accent)">Acquisition owner</text>
<text x="34" y="178" font-size="18">Owns sensor operation and result</text>
<text x="34" y="203" font-size="18">lifetime. A timeout invalidates the</text>
<text x="34" y="228" font-size="18">operation before driver recovery.</text>
<text x="212" y="287" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="294" width="400" height="146" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="324" font-size="19" style="fill:var(--accent)">Record store</text>
<text x="34" y="354" font-size="18">Owns immutable value, identity and</text>
<text x="34" y="379" font-size="18">time. Capacity: 360 slots. Overflow is</text>
<text x="34" y="404" font-size="18">visible degraded service.</text>
<text x="212" y="463" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="470" width="400" height="146" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="500" font-size="19" style="fill:var(--accent)">Communication owner</text>
<text x="34" y="530" font-size="18">Borrows records. Current traffic has</text>
<text x="34" y="555" font-size="18">priority. Only application receipts</text>
<text x="34" y="580" font-size="18">permit reclamation.</text>
<text x="212" y="639" font-size="20" style="fill:var(--line)">↓</text>
<rect x="20" y="646" width="400" height="146" rx="10" fill="var(--card)" stroke="var(--line)"/>
<text x="34" y="676" font-size="19" style="fill:var(--accent)">Lifecycle and diagnostics</text>
<text x="34" y="706" font-size="18">Own activation and recovery policy.</text>
<text x="34" y="731" font-size="18">Observe bounded evidence; do not</text>
<text x="34" y="756" font-size="18">overwrite records.</text>
<text x="24" y="836" font-size="17" style="fill:var(--muted)">Assumptions and limits in the caption.</text>
</svg>
